name: "Upload debs"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "palera1n tag"
        required: true
        type: string
  release:
    types: [published]

env:
  TAG: ${{ github.event.inputs.version || github.event.release.tag_name }}

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download debs from tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ env.TAG }}"
          mkdir -p cdn-upload
          cp *.tar.gz cdn-upload/
          cp *.deb cdn-upload/
          cp *.dmg cdn-upload/

      - name: Upload debs to repo
        if: github.repository == 'palera1n/palera1n'
        env:
          USERNAME: GitHub-Actions
          API_TOKEN: ${{ secrets.BUILD_GITHUB_TOKEN }}
          GH_REPO: palera1n/repo.palera.in
        run: |
          git clone https://$USERNAME:$API_TOKEN@github.com/$GH_REPO.git repo-upload

          rm -rf repo-upload/dists/stable/main/binary-iphoneos-arm{,64}/palera1n*.deb
          cp palera1n-iphoneos-arm64.deb repo-upload/pool/iphoneos-arm64/palera1n-iphoneos-arm64.deb
          cp palera1n-iphoneos-arm.deb repo-upload/pool/iphoneos-arm/palera1n-iphoneos-arm.deb

          cd repo-upload

          git config user.name "$USERNAME"
          git config user.email "actions@github.com"

          git add .
          git commit -m "Update palera1n for ${{ env.TAG }}" || exit 0
          git push https://$USERNAME:$API_TOKEN@github.com/$GH_REPO.git

      - name: Upload artifacts to cdn
        if: github.repository == 'palera1n/palera1n'
        uses: wangyucode/sftp-upload-action@v3
        with:
          host: ${{ secrets.NICKCHAN_FTP_HOST }}
          port: ${{ secrets.NICKCHAN_FTP_PORT }}
          username: palera1n
          password: ${{ secrets.NICKCHAN_FTP_PASS }}
          forceUpload: true
          dryRun: false
          localDir: 'cdn-upload'
          remoteDir: "/palera1n/c-rewrite/releases/${{ env.TAG }}"

      - name: Bump palen1x
        if: github.repository == 'palera1n/palera1n'
        env:
          USERNAME: GitHub-Actions
          API_TOKEN: ${{ secrets.BUILD_GITHUB_TOKEN }}
          GH_REPO: palera1n/palen1x
          BRANCH: Alpine
        run: |
          git clone https://$USERNAME:$API_TOKEN@github.com/$GH_REPO.git tag
          cd tag

          git config --global user.name "$USERNAME"
          git config --global user.email "actions@github.com"

          git commit --allow-empty -m "bump to ${{ env.TAG }}"
          git push https://$USERNAME:$API_TOKEN@github.com/$GH_REPO.git "$BRANCH"

          git tag "${{ env.TAG }}"
          git push https://$USERNAME:$API_TOKEN@github.com/$GH_REPO.git "${{ env.TAG }}"
